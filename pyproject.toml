[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-code-diff"
version = "0.1.0"
description = "AST-aware unified diff generator and patch validator for agent code refactoring"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-code-diff = "agent_code_diff.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_code_diff*"]
